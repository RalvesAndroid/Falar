<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz Digital - Conversor de Texto em Fala</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #111827;
                --card-bg: #1f2937;
                --text: #f9fafb;
                --border: #374151;
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background-color: transparent;
            color: var(--text);
            font-size: 18px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.8;
        }

        select, input[type="range"] {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .shortcuts {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed var(--border);
            font-size: 14px;
            opacity: 0.7;
            text-align: center;
        }

        kbd {
            background-color: var(--border);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Voz Digital</h1>
        
        <textarea id="text-input" placeholder="Digite o que você quer dizer aqui..." autofocus></textarea>
        
        <div class="controls">
            <div class="form-group">
                <label for="voice-select">Voz / Idioma</label>
                <select id="voice-select">
                    <option value="">Carregando vozes...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="speed-range">Velocidade (<span id="speed-val">1</span>x)</label>
                <input type="range" id="speed-range" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>

        <button id="speak-btn" class="btn">
            🔊 Falar
        </button>

        <div class="shortcuts">
            Dica: Pressione <kbd>Enter</kbd> para falar ou <kbd>Esc</kbd> para limpar o texto.
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const speedRange = document.getElementById('speed-range');
        const speedVal = document.getElementById('speed-val');
        const speakBtn = document.getElementById('speak-btn');

        let voices = [];

        // Inicializa e carrega as vozes do sistema
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            
            // Limpa o select
            voiceSelect.innerHTML = '';

            // Prioriza vozes em português e filtra duplicadas ou vazias
            const ptVozes = voices.filter(v => v.lang.includes('pt'));
            const outrasVozes = voices.filter(v => !v.lang.includes('pt'));
            
            const listaOrdenada = [...ptVozes, ...outrasVozes];

            if (listaOrdenada.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = 'Nenhuma voz encontrada';
                voiceSelect.appendChild(opt);
                return;
            }

            listaOrdenada.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                
                // Define português como padrão se disponível
                if (voice.lang.includes('pt-BR') && !voiceSelect.value) {
                    option.selected = true;
                }
                
                voiceSelect.appendChild(option);
            });
        }

        // Necessário porque o carregamento de vozes é assíncrono em alguns navegadores
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        // Função principal para falar
        function speak() {
            // Se já estiver falando, cancela a fala anterior para não encavalar
            window.speechSynthesis.cancel();

            const text = textInput.value.trim();
            if (!text) return;

            const utterance = new SpeechSynthesisUtterance(text);
            
            // Seleciona a voz configurada
            const selectedVoiceName = voiceSelect.value;
            const selectedVoice = voices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            // Configura a velocidade
            utterance.rate = parseFloat(speedRange.value);

            window.speechSynthesis.speak(utterance);
        }

        // Atualiza o texto do indicador de velocidade
        speedRange.addEventListener('input', () => {
            speedVal.textContent = speedRange.value;
        });

        // Evento de clique no botão
        speakBtn.addEventListener('click', speak);

        // Atalhos de teclado para acessibilidade rápida
        textInput.addEventListener('keydown', (e) => {
            // Pressionar Enter fala o texto (sem quebrar a linha)
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                speak();
            }
            // Pressionar Esc limpa a caixa
            if (e.key === 'Escape') {
                textInput.value = '';
            }
        });
    </script>
</body>
</html>
